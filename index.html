<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda Personal Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sonner@latest"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            overflow-x: hidden;
        }
        
        .container-main {
            display: flex;
            height: 100vh;
            position: relative;
        }
        
        .sidebar {
            width: 320px;
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow-y: auto;
            border-right: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            z-index: 50;
        }
        
        .sidebar.closed {
            width: 0;
            transform: translateX(-100%);
        }
        
        .sidebar-header {
            padding: 24px;
            border-bottom: 1px solid #e2e8f0;
            background: linear-gradient(to right, #1f2937, #0d9488);
            color: white;
        }
        
        .sidebar-header h1 {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 4px;
        }
        
        .sidebar-header p {
            font-size: 14px;
            color: #7dd3c0;
        }
        
        .sidebar-content {
            padding: 24px;
            flex: 1;
            overflow-y: auto;
        }
        
        .form-group {
            margin-bottom: 16px;
        }
        
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }
        
        .form-group input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #0d9488;
            box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.1);
        }
        
        .color-picker {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }
        
        .color-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .color-btn:hover {
            transform: scale(1.1);
        }
        
        .color-btn.selected {
            box-shadow: 0 0 0 2px #e2e8f0, 0 0 0 4px #94a3b8;
            transform: scale(1.15);
        }
        
        .btn {
            width: 100%;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .btn-primary {
            background: #0d9488;
            color: white;
        }
        
        .btn-primary:hover {
            background: #0f766e;
            box-shadow: 0 10px 15px rgba(13, 148, 136, 0.3);
        }
        
        .btn-secondary {
            background: white;
            color: #374151;
            border: 1px solid #d1d5db;
        }
        
        .btn-secondary:hover {
            background: #f3f4f6;
        }
        
        .alunas-list {
            margin-top: 32px;
        }
        
        .alunas-list h2 {
            font-size: 18px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 12px;
        }
        
        .aluna-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            background: #f9fafb;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid;
            transition: all 0.2s;
            cursor: move;
        }
        
        .aluna-item:hover {
            background: #f3f4f6;
        }
        
        .aluna-info {
            flex: 1;
            min-width: 0;
        }
        
        .aluna-name {
            font-weight: 600;
            color: #111827;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .aluna-phone {
            font-size: 12px;
            color: #6b7280;
            margin-top: 2px;
        }
        
        .aluna-actions {
            display: flex;
            gap: 4px;
            margin-left: 8px;
        }
        
        .btn-icon {
            padding: 6px;
            background: none;
            border: none;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.2s;
            border-radius: 4px;
        }
        
        .btn-icon:hover {
            color: #0d9488;
            background: #d1fae5;
        }
        
        .btn-icon.delete:hover {
            color: #dc2626;
            background: #fee2e2;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }
        
        .header {
            background: linear-gradient(to right, #1f2937, #0d9488);
            color: white;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .toggle-btn {
            padding: 8px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .toggle-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        
        .header-title h2 {
            font-size: 20px;
            font-weight: bold;
        }
        
        .schedule-container {
            flex: 1;
            overflow: auto;
            padding: 16px;
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
        }
        
        .schedule-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            min-width: 800px;
        }
        
        .day-column {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }
        
        .day-header {
            background: linear-gradient(to right, #1f2937, #0d9488);
            color: white;
            padding: 12px;
            font-weight: bold;
            text-align: center;
            font-size: 14px;
        }
        
        .day-slots {
            padding: 8px;
        }
        
        .time-slot {
            padding: 8px;
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            margin-bottom: 8px;
            min-height: 50px;
            transition: all 0.2s;
            cursor: pointer;
            background: #f9fafb;
            position: relative;
        }
        
        .time-label {
            font-size: 11px;
            font-weight: 600;
            color: #6b7280;
            margin-bottom: 2px;
        }
        
        .aluna-card {
            padding: 6px;
            border-radius: 6px;
            color: white;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .remove-btn {
            background: rgba(0,0,0,0.2);
            border: none;
            color: white;
            cursor: pointer;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 12px 24px;
            border-radius: 8px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease;
        }
        .toast.success { background: #0d9488; }
        .toast.error { background: #dc2626; }

        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes slideOut { from { transform: translateX(0); } to { transform: translateX(100%); } }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .sidebar {
                position: absolute;
                left: 0;
                top: 0;
                height: 100%;
                width: 280px;
                box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            }
            
            .sidebar.closed {
                transform: translateX(-100%);
                width: 280px; /* Keep width for animation */
            }

            .schedule-grid {
                min-width: 1000px; /* Ensure horizontal scroll on mobile */
            }
            
            .header-title h2 {
                font-size: 16px;
            }
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 40;
        }

        .sidebar:not(.closed) + .main-content .overlay {
            display: block;
        }
        
        @media (min-width: 769px) {
            .overlay { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="container-main">
        <!-- Sidebar -->
        <aside id="sidebar" class="sidebar closed">
            <div class="sidebar-header">
                <h1>Cadastro</h1>
                <p>Gerencie suas alunas</p>
            </div>
            <div class="sidebar-content">
                <div class="form-group">
                    <label>Nome da Aluna</label>
                    <input type="text" id="nomeAluna" placeholder="Ex: Maria Silva">
                </div>
                <div class="form-group">
                    <label>Telefone (Opcional)</label>
                    <input type="text" id="telefoneAluna" placeholder="(00) 00000-0000">
                </div>
                <div class="form-group">
                    <label>Cor de Identificação</label>
                    <div id="colorPicker" class="color-picker"></div>
                </div>
                <button id="btnAdicionar" class="btn btn-primary">➕ Adicionar Aluna</button>
                <button id="btnCancelar" class="btn btn-secondary mt-2" style="display: none;">❌ Cancelar</button>
                
                <div class="alunas-list">
                    <h2>Minhas Alunas</h2>
                    <div id="listaAlunas"></div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="overlay" class="overlay"></div>
            <header class="header">
                <button id="toggleSidebar" class="toggle-btn">☰</button>
                <div class="header-title">
                    <h2>Agenda Personal Trainer</h2>
                </div>
                <div class="ml-auto flex gap-2">
                    <button id="btnExportar" class="btn btn-secondary py-1 px-3 text-xs">📥 Exportar</button>
                </div>
            </header>

            <div class="schedule-container">
                <div id="scheduleGrid" class="schedule-grid">
                    <!-- Gerado via JS -->
                </div>
            </div>
        </main>
    </div>

    <script>
        const CORES = ['#1e3a8a', '#0d9488', '#dc2626', '#9333ea', '#f59e0b', '#06b6d4', '#8b5cf6', '#ec4899'];
        const DIAS = ['Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta'];
        const HORARIOS = ['06:00', '07:00', '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00', '17:00', '18:00', '19:00', '20:00', '21:00', '22:00'];

        let alunas = [];
        let agendamentos = [];
        let alunaEmEdicao = null;
        let draggedAluna = null;
        let corSelecionada = 0;

        const sidebar = document.getElementById('sidebar');
        const overlay = document.getElementById('overlay');
        const toggleBtn = document.getElementById('toggleSidebar');
        const nomeInput = document.getElementById('nomeAluna');
        const telefoneInput = document.getElementById('telefoneAluna');
        const btnAdicionar = document.getElementById('btnAdicionar');
        const btnCancelar = document.getElementById('btnCancelar');
        const btnExportar = document.getElementById('btnExportar');
        const listaAlunas = document.getElementById('listaAlunas');
        const scheduleGrid = document.getElementById('scheduleGrid');
        const colorPicker = document.getElementById('colorPicker');

        function init() {
            carregarDados();
            criarColorPicker();
            renderizarAlunas();
            renderizarAgenda();
            
            toggleBtn.addEventListener('click', () => {
                sidebar.classList.toggle('closed');
                overlay.style.display = sidebar.classList.contains('closed') ? 'none' : 'block';
            });

            overlay.addEventListener('click', () => {
                sidebar.classList.add('closed');
                overlay.style.display = 'none';
            });
            
            btnAdicionar.addEventListener('click', adicionarAluna);
            btnCancelar.addEventListener('click', cancelarEdicao);
            btnExportar.addEventListener('click', exportarAgenda);
        }

        function criarColorPicker() {
            CORES.forEach((cor, idx) => {
                const btn = document.createElement('button');
                btn.className = 'color-btn';
                btn.style.backgroundColor = cor;
                if (idx === 0) btn.classList.add('selected');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    corSelecionada = idx;
                });
                colorPicker.appendChild(btn);
            });
        }

        function carregarDados() {
            const alunasSalvas = localStorage.getItem('alunas');
            const agendamentosSalvos = localStorage.getItem('agendamentos');
            if (alunasSalvas) alunas = JSON.parse(alunasSalvas);
            if (agendamentosSalvos) agendamentos = JSON.parse(agendamentosSalvos);
        }

        function salvarDados() {
            localStorage.setItem('alunas', JSON.stringify(alunas));
            localStorage.setItem('agendamentos', JSON.stringify(agendamentos));
        }

        function adicionarAluna() {
            const nome = nomeInput.value.trim();
            if (!nome) return mostrarToast('Digite o nome', 'error');

            const aluna = {
                id: alunaEmEdicao ? alunaEmEdicao.id : Date.now(),
                nome: nome,
                telefone: telefoneInput.value,
                cor: CORES[corSelecionada]
            };

            if (alunaEmEdicao) {
                const idx = alunas.findIndex(a => a.id === alunaEmEdicao.id);
                alunas[idx] = aluna;
                alunaEmEdicao = null;
            } else {
                alunas.push(aluna);
            }

            salvarDados();
            cancelarEdicao();
            renderizarAlunas();
            renderizarAgenda();
            mostrarToast('Salvo com sucesso!', 'success');
        }

        function cancelarEdicao() {
            alunaEmEdicao = null;
            nomeInput.value = '';
            telefoneInput.value = '';
            btnCancelar.style.display = 'none';
            btnAdicionar.textContent = '➕ Adicionar Aluna';
        }

        function editarAluna(aluna) {
            alunaEmEdicao = aluna;
            nomeInput.value = aluna.nome;
            telefoneInput.value = aluna.telefone;
            corSelecionada = CORES.indexOf(aluna.cor);
            document.querySelectorAll('.color-btn').forEach((btn, idx) => {
                btn.classList.toggle('selected', idx === corSelecionada);
            });
            btnCancelar.style.display = 'block';
            btnAdicionar.textContent = '✏️ Atualizar';
            if (window.innerWidth <= 768) {
                sidebar.classList.remove('closed');
                overlay.style.display = 'block';
            }
        }

        function removerAluna(id) {
            if (confirm('Remover aluna?')) {
                alunas = alunas.filter(a => a.id !== id);
                agendamentos = agendamentos.filter(a => a.alunaId !== id);
                salvarDados();
                renderizarAlunas();
                renderizarAgenda();
            }
        }

        function renderizarAlunas() {
            listaAlunas.innerHTML = alunas.length ? '' : '<p class="text-xs text-gray-400">Nenhuma aluna</p>';
            alunas.forEach(aluna => {
                const item = document.createElement('div');
                item.className = 'aluna-item';
                item.style.borderLeftColor = aluna.cor;
                item.draggable = true;
                item.innerHTML = `
                    <div class="aluna-info">
                        <div class="aluna-name">${aluna.nome}</div>
                    </div>
                    <div class="aluna-actions">
                        <button onclick="event.stopPropagation();" class="edit-btn">✏️</button>
                        <button onclick="event.stopPropagation();" class="del-btn">🗑️</button>
                    </div>
                `;
                item.querySelector('.edit-btn').onclick = () => editarAluna(aluna);
                item.querySelector('.del-btn').onclick = () => removerAluna(aluna.id);
                item.addEventListener('dragstart', () => draggedAluna = aluna);
                // Touch support for mobile
                item.addEventListener('click', () => {
                    if(window.innerWidth <= 768) {
                        // On mobile, clicking selects for next slot click
                        draggedAluna = aluna;
                        mostrarToast(`Selecionada: ${aluna.nome}. Toque num horário.`, 'success');
                    }
                });
                listaAlunas.appendChild(item);
            });
        }

        function renderizarAgenda() {
            scheduleGrid.innerHTML = '';
            DIAS.forEach(dia => {
                const coluna = document.createElement('div');
                coluna.className = 'day-column';
                coluna.innerHTML = `<div class="day-header">${dia}</div><div class="day-slots"></div>`;
                const slotsDiv = coluna.querySelector('.day-slots');
                
                HORARIOS.forEach(horario => {
                    const slot = document.createElement('div');
                    slot.className = 'time-slot';
                    slot.innerHTML = `<div class="time-label">${horario}</div>`;
                    
                    const agendamento = agendamentos.find(a => a.dia === dia && a.horario === horario);
                    const aluna = agendamento ? alunas.find(a => a.id === agendamento.alunaId) : null;
                    
                    if (aluna) {
                        slot.classList.add('occupied');
                        slot.style.backgroundColor = aluna.cor + '15';
                        slot.style.borderColor = aluna.cor;
                        slot.innerHTML += `
                            <div class="aluna-card" style="background-color: ${aluna.cor}">
                                <span>${aluna.nome}</span>
                                <button class="remove-btn">✕</button>
                            </div>
                        `;
                        slot.querySelector('.remove-btn').onclick = (e) => {
                            e.stopPropagation();
                            agendamentos = agendamentos.filter(a => !(a.dia === dia && a.horario === horario));
                            salvarDados();
                            renderizarAgenda();
                        };
                    }

                    slot.addEventListener('dragover', (e) => e.preventDefault());
                    slot.addEventListener('drop', () => {
                        if (draggedAluna) {
                            agendamentos = agendamentos.filter(a => !(a.dia === dia && a.horario === horario));
                            agendamentos.push({ alunaId: draggedAluna.id, dia, horario });
                            salvarDados();
                            renderizarAgenda();
                            draggedAluna = null;
                        }
                    });
                    
                    // Mobile click to schedule
                    slot.addEventListener('click', () => {
                        if (draggedAluna) {
                            agendamentos = agendamentos.filter(a => !(a.dia === dia && a.horario === horario));
                            agendamentos.push({ alunaId: draggedAluna.id, dia, horario });
                            salvarDados();
                            renderizarAgenda();
                            draggedAluna = null;
                        }
                    });

                    slotsDiv.appendChild(slot);
                });
                scheduleGrid.appendChild(coluna);
            });
        }

        function exportarAgenda() {
            let csv = 'Dia,Horario,Aluna\n';
            agendamentos.forEach(a => {
                const aluna = alunas.find(al => al.id === a.alunaId);
                if(aluna) csv += `${a.dia},${a.horario},${aluna.nome}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'agenda.csv';
            a.click();
        }

        function mostrarToast(msg, tipo) {
            const t = document.createElement('div');
            t.className = `toast ${tipo}`;
            t.textContent = msg;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => t.remove(), 300);
            }, 2000);
        }

        init();
    </script>
</body>
</html>
